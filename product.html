<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>
<header class="top"><a href="./" class="logo">♻ <span data-site></span></a></header>
<main class="wrap">
  <a class="back" href="./">← Înapoi la produse</a>
  <div id="out"></div>
</main>
<script>
var WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1s-.5-.1-.7.1-.8 1-.9 1.2-.3.2-.6.1a8.2 8.2 0 0 1-4-3.5c-.3-.5.3-.5.9-1.6.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6a1.1 1.1 0 0 0-.8.4 3.4 3.4 0 0 0-1 2.5 5.9 5.9 0 0 0 1.2 3.1 13.4 13.4 0 0 0 5.2 4.6c1.9.8 2.7.9 3.6.7a3.1 3.1 0 0 0 2-1.4 2.5 2.5 0 0 0 .2-1.4c-.1-.1-.3-.2-.6-.3zM12 21.8a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.8 9.8 0 1 1 12 21.8zm8.4-18.2A11.8 11.8 0 0 0 1.9 17.9L.2 24l6.3-1.6a11.8 11.8 0 0 0 5.6 1.4A11.8 11.8 0 0 0 20.4 3.6z"/></svg>';
var id = new URLSearchParams(location.search).get("id");
loadProducts().then(function (items) {
  var p = items.filter(function (x) { return x.id === id; })[0];
  var out = document.getElementById("out");
  if (!p) { out.innerHTML = '<p class="empty">Produsul nu mai există.</p>'; return; }
  document.title = p.title + " – " + C.siteName;
  var qty = p.quantity == null ? 1 : p.quantity;
  var photos = p.photos || [];
  var gallery = photos.length
    ? photos.map(function (ph) { return '<img src="' + esc(ph) + '" alt="">'; }).join("")
    : '<div class="nophoto big" style="flex:1">Fără poză</div>';
  var msg = "Bună! Sunt interesat de: " + p.title + " (" + price(p.price) + "). " + location.href;
  var num = waNumber(p.phone || C.whatsapp);
  var wa = "https://wa.me/" + num + "?text=" + encodeURIComponent(msg);
  out.innerHTML =
    '<div class="detail"><div><div class="gallery">' + gallery + '</div>' +
    (photos.length > 1 ? '<div class="hint">' + photos.length + ' poze — glisează pentru mai multe →</div>' : '') +
    '</div><div class="dinfo"><p class="pr big">' + esc(price(p.price)) + '</p><h1>' + esc(p.title) + '</h1>' +
    '<div class="meta">' + (p.location ? '📍 ' + esc(p.location) + '<br>' : '') +
    '📦 Stoc: ' + qty + ' buc<br>🗓 Adăugat pe ' + fmtDate(p.created) + '</div>' +
    (p.description ? '<h3>Descriere</h3><p class="desc">' + esc(p.description) + '</p>' : '') +
    (qty > 0 && num
      ? '<a class="wa" href="' + esc(wa) + '" target="_blank" rel="noopener">' + WA_ICON + ' Contactează pentru comandă</a>'
      : '<div class="soldout">' + (qty > 0 ? "Contact indisponibil" : "Stoc epuizat") + '</div>') +
    '</div></div>';
});
</script>
</body>
</html>
